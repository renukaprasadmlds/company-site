  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="71" y="116" text-anchor="middle">S/4HANA</text>
  <path stroke="#B45309" stroke-width="1.75" fill="none" d="M126 102 H168"/>
  <polygon fill="#B45309" points="168,98 178,102 168,106"/>
  <rect fill="#fff7ed" stroke="#B45309" stroke-width="1.75" x="178" y="54" width="150" height="96" rx="6"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#333333" x="253" y="90" text-anchor="middle">SAP DM</text>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="253" y="108" text-anchor="middle">Cloud MES  /  BTP</text>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="253" y="124" text-anchor="middle">target state</text>
  <path stroke="#B45309" stroke-width="1.75" fill="none" d="M328 102 H370"/>
  <polygon fill="#B45309" points="370,98 380,102 370,106"/>
  <rect fill="#fafafa" stroke="#888888" stroke-opacity="0.4" stroke-width="1.5" x="380" y="70" width="110" height="64" rx="6"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#333333" x="435" y="98" text-anchor="middle">Edge</text>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="435" y="116" text-anchor="middle">IIoT  /  OPC UA</text>
  <path stroke="#B45309" stroke-width="1.75" fill="none" d="M490 102 H532"/>
  <polygon fill="#B45309" points="532,98 542,102 532,106"/>
