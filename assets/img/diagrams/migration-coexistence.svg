<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="diag-mig-title diag-mig-desc">
  <title id="diag-mig-title">Phased coexistence architecture</title>
  <desc id="diag-mig-desc">ERP connects to SAP Digital Manufacturing on BTP, which connects to the edge layer and shop-floor machines, with a parallel path for legacy MII during migration.</desc>
