  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="583" y="116" text-anchor="middle">Machines</text>
  <rect fill="#fafafa" stroke="#888888" stroke-opacity="0.4" stroke-width="1.5" x="178" y="168" width="150" height="40" rx="6"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#333333" x="253" y="193" text-anchor="middle">Legacy MII / ME</text>
  <path stroke="#888888" stroke-width="1.25" stroke-dasharray="4 3" fill="none" d="M253 150 V168"/>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="320" y="162" text-anchor="start">coexistence</text>
