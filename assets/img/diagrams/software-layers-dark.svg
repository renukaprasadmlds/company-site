<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="diag-stack-title-d diag-stack-desc-d">
  <title id="diag-stack-title-d">Manufacturing software layers</title>
  <desc id="diag-stack-desc-d">Four software layers from enterprise planning through MES and edge to the physical shop floor.</desc>
  <rect fill="#242424" stroke="#666666" stroke-width="1.5" x="20" y="16" width="600" height="28" rx="4"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" x="36" y="35">Enterprise planning</text>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="520" y="35" text-anchor="end">ERP  /  S/4HANA</text>
  <rect fill="#2a2118" stroke="#F59E0B" stroke-width="1.75" x="20" y="52" width="600" height="28" rx="4"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" x="36" y="71">MES / MOM execution</text>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="520" y="71" text-anchor="end">SAP DM  /  PEO  /  ME</text>
  <rect fill="#242424" stroke="#666666" stroke-width="1.5" x="20" y="88" width="600" height="28" rx="4"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" x="36" y="107">Edge &amp; IIoT data</text>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="520" y="107" text-anchor="end">Telemetry  /  OPC UA</text>
  <rect fill="#242424" stroke="#666666" stroke-width="1.5" x="20" y="124" width="600" height="28" rx="4"/>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" x="36" y="143">Shop floor</text>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#888888" x="520" y="143" text-anchor="end">Machines  /  Lines</text>
</svg>
